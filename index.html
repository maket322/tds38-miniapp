<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>TDS38</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <img src="logo.png" alt="TDS38" class="logo">
      <div><b>TDS38</b><span>БОЛЬШЕ ЧЕМ МАГАЗИН</span><small>Иркутск • Шелехов • 38 регион</small></div>
    </div>
    <button class="icon-btn" id="searchBtn" aria-label="Поиск">⌕</button>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <small>TDS38</small>
        <h1>КАЧЕСТВО<br><em>В ДЕТАЛЯХ</em></h1>
        <p>Каталог продукции и актуальное наличие в магазинах.</p>
        <button id="catalogBtn">ПЕРЕЙТИ К КАТАЛОГУ →</button>
      </div>
      <div class="hero-art"><span>TDS38</span><small>38 REGION</small></div>
    </section>

    <section class="search-wrap" id="searchWrap">
      <input id="search" type="search" placeholder="Найти бренд…" autocomplete="off">
    </section>

    <section class="category-grid" id="categoryGrid"></section>
    <div id="sections"></div>

    <section class="info-card">
      <div><small>TDS38</small><h2>В ТВОЁМ ГОРОДЕ</h2><p>Иркутск • Шелехов • 38 регион</p></div>
      <div class="info-features"><span>◇ Оригинальная продукция</span><span>⌖ Актуальное наличие</span></div>
    </section>
  </main>

  <nav class="bottom">
    <button class="active" data-nav="home">⌂<span>Главная</span></button>
    <button data-nav="catalog">▦<span>Каталог</span></button>
    <button data-nav="info">ⓘ<span>Информация</span></button>
    <button data-nav="profile">♙<span>Профиль</span></button>
  </nav>

  <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-card">
      <button class="close" id="closeSheet">×</button>
      <div id="sheetContent"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
